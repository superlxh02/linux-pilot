# 订单副本分散在两个工作节点，库存固定在第二个工作节点。
# 这样订单服务既跨节点聚合，订单到库存的调用也形成真实的跨节点网络流量。
apiVersion: v1
kind: Namespace
metadata:
  name: linux-pilot-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: linux-pilot-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: catalog }
  template:
    metadata:
      labels:
        app: catalog
        app.kubernetes.io/name: catalog
      annotations:
        resource.opentelemetry.io/service.name: catalog
    spec:
      nodeSelector:
        kubernetes.io/hostname: linux-pilot-sim-worker2
      containers:
        - name: catalog
          image: linux-pilot-demo:local
          imagePullPolicy: Never
          env:
            - { name: SERVICE_ROLE, value: catalog }
          ports: [{ containerPort: 8080 }]
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: "1", memory: 256Mi }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 2
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: linux-pilot-demo
spec:
  selector: { app: catalog }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: linux-pilot-demo
spec:
  replicas: 2
  selector:
    matchLabels: { app: orders }
  template:
    metadata:
      labels:
        app: orders
        app.kubernetes.io/name: orders
      annotations:
        resource.opentelemetry.io/service.name: orders
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app: orders }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: node-role.kubernetes.io/control-plane, operator: DoesNotExist }
      containers:
        - name: orders
          image: linux-pilot-demo:local
          imagePullPolicy: Never
          env:
            - { name: SERVICE_ROLE, value: orders }
            - { name: PEER_URL, value: "http://catalog.linux-pilot-demo.svc.cluster.local:8080" }
          ports: [{ containerPort: 8080 }]
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: "1", memory: 256Mi }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 2
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: linux-pilot-demo
spec:
  type: NodePort
  selector: { app: orders }
  ports:
    - { port: 8080, targetPort: 8080, nodePort: 30080 }
