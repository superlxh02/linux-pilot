# kind 的三个 Linux 节点均运行在 Docker Desktop 的 Linux VM 中。
# 两个 worker 节点用于验证跨节点服务聚合；18080 是唯一暴露给 macOS 的演示入口。
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  apiServerAddress: "127.0.0.1"
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 18080
        listenAddress: "127.0.0.1"
        protocol: TCP
  - role: worker
  - role: worker
