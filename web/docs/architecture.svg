<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
  <title id="title">Linux-Pilot 架构图</title>
  <desc id="description">普通 Linux 主机与 Kubernetes Node 上的 Worker 通过可靠 gRPC 流上报中心端。DDD 后端将指标写入 PostgreSQL，并通过 HTTP 与 WebSocket 服务 Vue 3 控制台。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#57718f"/></marker>
    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#f7faff"/><stop offset="1" stop-color="#eef5fb"/></linearGradient>
    <style>
      .bg{fill:url(#paper)} .card{fill:#fff;stroke:#dce7f1;stroke-width:1.5} .blue{fill:#eaf2ff;stroke:#b6cff8} .green{fill:#e9f8f3;stroke:#a6dfcb} .orange{fill:#fff4e8;stroke:#f1d2a9}
      .title{font:700 27px -apple-system,BlinkMacSystemFont,"Noto Sans CJK SC",sans-serif;fill:#18324d} .section{font:700 17px -apple-system,BlinkMacSystemFont,"Noto Sans CJK SC",sans-serif;fill:#1e3853}
      .body{font:14px -apple-system,BlinkMacSystemFont,"Noto Sans CJK SC",sans-serif;fill:#4d6379} .small{font:12px -apple-system,BlinkMacSystemFont,"Noto Sans CJK SC",sans-serif;fill:#6e8398}
      .line{fill:none;stroke:#57718f;stroke-width:2.2;marker-end:url(#arrow)} .dash{fill:none;stroke:#8ba7bd;stroke-width:1.7;stroke-dasharray:5 5}
    </style>
  </defs>
  <rect class="bg" width="1200" height="560" rx="22"/>
  <text x="40" y="54" class="title">Linux-Pilot · 从内核信号到服务视角</text>
  <text x="40" y="79" class="body">独立部署的 Rust Worker 与 Web；同一数据链路支持普通主机和 Kubernetes 集群</text>

  <rect x="40" y="119" width="290" height="176" rx="16" class="card"/>
  <rect x="57" y="137" width="256" height="49" rx="10" class="blue"/>
  <text x="73" y="157" class="section">普通主机集群</text>
  <text x="73" y="177" class="small">每台 Linux 主机一个 Worker</text>
  <text x="60" y="218" class="body">/proc · 文件系统 · 进程/线程</text>
  <text x="60" y="246" class="body">eBPF · perf · cgroup v2</text>
  <text x="60" y="274" class="small">进程身份：PID + 启动 tick</text>

  <rect x="40" y="315" width="290" height="176" rx="16" class="card"/>
  <rect x="57" y="333" width="256" height="49" rx="10" class="green"/>
  <text x="73" y="353" class="section">Kubernetes 集群</text>
  <text x="73" y="373" class="small">每个 Node 一个 Worker DaemonSet Pod</text>
  <text x="60" y="414" class="body">Pod UID · 父 cgroup · 网络命名空间</text>
  <text x="60" y="442" class="body">Deployment → Pod → Node</text>
  <text x="60" y="470" class="small">服务跨节点聚合；Pod 副本单独查看</text>

  <rect x="420" y="180" width="202" height="232" rx="16" class="card"/>
  <rect x="438" y="198" width="166" height="50" rx="11" class="blue"/>
  <text x="457" y="229" class="section">Rust Worker</text>
  <text x="441" y="283" class="body">分层采样与有界队列</text>
  <text x="441" y="316" class="body">磁盘缓冲 / 断线回放</text>
  <text x="441" y="349" class="body">批次序号 / ACK 去重</text>
  <text x="441" y="383" class="small">独立 Cargo 项目</text>

  <rect x="706" y="119" width="280" height="372" rx="16" class="card"/>
  <rect x="724" y="137" width="244" height="53" rx="11" class="green"/>
  <text x="741" y="159" class="section">Rust Web · DDD 后端</text>
  <text x="741" y="178" class="small">Axum + SeaORM + tracing</text>
  <rect x="727" y="211" width="238" height="55" rx="9" class="blue"/>
  <text x="744" y="233" class="body">接口层 · gRPC / HTTP / WS</text>
  <text x="744" y="252" class="small">鉴权、协议转换、推送</text>
  <rect x="727" y="277" width="238" height="55" rx="9" class="blue"/>
  <text x="744" y="299" class="body">应用层 · 采集 / 查询 / 告警</text>
  <text x="744" y="318" class="small">仓储端口与任务编排</text>
  <rect x="727" y="343" width="238" height="55" rx="9" class="orange"/>
  <text x="744" y="365" class="body">领域层 · 场景评分规则</text>
  <text x="744" y="384" class="small">确定性评分，可扩展分析器</text>
  <text x="734" y="453" class="small">基础设施：PostgreSQL / SMTP</text>

  <rect x="1030" y="151" width="136" height="117" rx="15" class="card"/>
  <text x="1045" y="181" class="section">Vue 3</text>
  <text x="1045" y="207" class="body">双模式工作台</text>
  <text x="1045" y="231" class="small">服务 / 节点 / 进程</text>
  <rect x="1030" y="337" width="136" height="117" rx="15" class="card"/>
  <text x="1045" y="369" class="section">PostgreSQL</text>
  <text x="1045" y="395" class="body">指标与拓扑</text>
  <text x="1045" y="421" class="small">批次去重 / 会话</text>

  <path class="line" d="M330 206 H376 V271 H420"/>
  <path class="line" d="M330 403 H376 V321 H420"/>
  <path class="line" d="M622 296 H706"/>
  <text x="630" y="276" class="small">gRPC / HTTP2</text>
  <path class="line" d="M986 209 H1030"/>
  <text x="991" y="185" class="small">HTTP + WS</text>
  <path class="line" d="M986 396 H1030"/>
  <text x="993" y="377" class="small">SeaORM</text>
  <path class="dash" d="M1098 268 V337"/>
  <text x="40" y="532" class="small">基础指标每秒采样；进程、设备和 cgroup 明细默认每 5 秒采样。图中均为真实交付边界。</text>
</svg>
